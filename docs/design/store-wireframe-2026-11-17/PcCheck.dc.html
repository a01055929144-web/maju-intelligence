<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주문 조건 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 760px; display: flex; font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #f4f5f6">
<aside style="width: 256px; flex: none; background: #111827; color: #e5e7eb; display: flex; flex-direction: column">
<div style="height: 72px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #1f2937"><span style="width: 32px; height: 32px; border-radius: 6px; background: {{accent}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700">M</span><div><p style="margin: 0; font-size: 14px; font-weight: 700; color: #ffffff">MAJU</p><p style="margin: 0; font-size: 12px; color: #9ca3af">매장</p></div></div>
<p style="margin: 20px 16px 8px; font-size: 12px; color: #9ca3af">매장</p>
<nav aria-label="매장 메뉴" style="display: flex; flex-direction: column; gap: 2px; padding: 0 8px"><a href="#" style="display: block; padding: 10px 12px; border-radius: 6px; font-size: 14px; text-decoration: none; color: #d1d5db; background: transparent; font-weight: 400">홈</a><a href="#" aria-current="page" style="display: block; padding: 10px 12px; border-radius: 6px; font-size: 14px; text-decoration: none; color: #ffffff; background: #1f2937; font-weight: 700">주문</a><a href="#" style="display: block; padding: 10px 12px; border-radius: 6px; font-size: 14px; text-decoration: none; color: #d1d5db; background: transparent; font-weight: 400">주문 내역</a><a href="#" style="display: block; padding: 10px 12px; border-radius: 6px; font-size: 14px; text-decoration: none; color: #d1d5db; background: transparent; font-weight: 400">데이터</a><a href="#" style="display: block; padding: 10px 12px; border-radius: 6px; font-size: 14px; text-decoration: none; color: #d1d5db; background: transparent; font-weight: 400">매장 정보</a></nav>
</aside>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; background: #ffffff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 16px"><p style="margin: 0; font-size: 18px; font-weight: 700">MAJU 매장</p></header>
<main style="width: 100%; padding: 16px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div><p style="margin: 0; font-size: 13px; color: #4b5563">[매장 이름]</p><h1 style="margin: 2px 0 0; font-size: 20px">주문 조건 확인</h1></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; align-items: start">
<div style="grid-column: span 2; min-width: 0; background: #ffffff; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 17px; font-weight: 700">[유통사 1]과 주문 조건</p><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 8px 0; border-bottom: 1px solid #e5e7eb"><span>사업자 상태</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #f0fdfa; color: #0f766e; font-size: 14px; white-space: nowrap">정상 (계속사업자)</span></span></div><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 8px 0; border-bottom: 1px solid #e5e7eb"><span>배송 가능 지역</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #f0fdfa; color: #0f766e; font-size: 14px; white-space: nowrap">가능 · 화 · 목 · 토</span></span></div><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 8px 0; border-bottom: 1px solid #e5e7eb"><span>결제 조건</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #f0fdfa; color: #0f766e; font-size: 14px; white-space: nowrap">후불 · 월말 정산</span></span></div><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 8px 0; border-bottom: 1px solid #e5e7eb"><span>최소 주문</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #fffbeb; color: #92400e; font-size: 14px; white-space: nowrap">[금액]원 이상</span></span></div><div style="display: flex; justify-content: space-between; gap: 12px; font-size: 15px; padding: 8px 0; border-bottom: 1px solid #e5e7eb"><span>동종업계 확인</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #f0fdfa; color: #0f766e; font-size: 14px; white-space: nowrap">통과</span></span></div><p style="margin: 0; font-size: 14px; color: #4b5563">하나라도 막히면 담당자 확인 뒤 열립니다. 결제는 지금 후불만 됩니다.</p></div><div style="min-width: 0; background: #ffffff; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 17px; font-weight: 700">다음</p><p style="margin: 0; font-size: 15px; color: #111827">조건을 모두 통과했습니다</p><button type="button" style="height: 48px; padding: 0 18px; border: 0; border-radius: 6px; background: {{accent}}; color: #ffffff; font-size: 16px; font-weight: 700; font-family: inherit">주문하러 가기</button><button type="button" style="height: 48px; padding: 0 18px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; font-size: 16px; font-family: inherit">담당자에게 전화</button></div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#0f766e"}, "$preview": {"width": 1440, "height": 760}}'>
class Component extends DCLogic {
renderVals() { return { accent: this.props.accent ?? '#0f766e' }; }
}
</script>
</body>
</html>
