<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>③ 주문 조건 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>html,body{margin:0;overflow-x:hidden}*{box-sizing:border-box}</style>
</helmet>
<div style="width: 100%; max-width: 390px; height: 844px; overflow: hidden; background: #f4f5f6; font-family: 'Noto Sans KR', sans-serif; color: #111827; display: flex; flex-direction: column">
<header style="background: #ffffff; padding: 10px 12px; border-bottom: 1px solid #e5e7eb"><p style="margin: 0; font-size: 13px; color: #4b5563">처음 한 번만 · 통과하면 바로 주문</p><p style="margin: 0; font-size: 18px; font-weight: 700">③ 주문 조건 확인</p></header>
<div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px; display: flex; flex-direction: column; gap: 8px"><section style="background: #ffffff; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0"><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 6px 0; border-bottom: 1px solid #f3f4f6"><span style="min-width: 0">사업자 상태</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #f0fdfa; color: #0f766e; font-size: 14px; white-space: nowrap">정상</span></span></div><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 6px 0; border-bottom: 1px solid #f3f4f6"><span style="min-width: 0">배송 가능 지역</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #f0fdfa; color: #0f766e; font-size: 14px; white-space: nowrap">가능 · 화 목 토</span></span></div><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 6px 0; border-bottom: 1px solid #f3f4f6"><span style="min-width: 0">결제 조건</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #f0fdfa; color: #0f766e; font-size: 14px; white-space: nowrap">후불</span></span></div><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 6px 0; border-bottom: 1px solid #f3f4f6"><span style="min-width: 0">최소 주문</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #fffbeb; color: #92400e; font-size: 14px; white-space: nowrap">[금액]원 이상</span></span></div><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 6px 0; border-bottom: 1px solid #f3f4f6"><span style="min-width: 0">동종업계 확인</span><span style="white-space: nowrap;"><span style="display: inline-block; padding: 2px 10px; border-radius: 12px; background: #f0fdfa; color: #0f766e; font-size: 14px; white-space: nowrap">통과</span></span></div></section><p style="margin: 0; font-size: 14px; color: #4b5563">하나라도 막히면 담당자 확인 뒤 열림 · 결제는 지금 후불만</p></div>
<div style="background: #ffffff; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #e5e7eb"><button type="button" style="width: 100%; height: 48px; border: 0; border-radius: 8px; background: {{accent}}; color: #ffffff; font-size: 16px; font-weight: 700; font-family: inherit">주문하러 가기</button><button type="button" style="width: 100%; height: 48px; border: 1px solid #d1d5db; border-radius: 8px; background: #ffffff; font-size: 16px; font-family: inherit">담당자에게 전화</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#0f766e"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() { return { accent: this.props.accent ?? '#0f766e' }; }
}
</script>
</body>
</html>
