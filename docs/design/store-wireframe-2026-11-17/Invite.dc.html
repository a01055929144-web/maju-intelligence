<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>직원 초대 받기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>html,body{margin:0;overflow-x:hidden}*{box-sizing:border-box}</style>
</helmet>
<div style="width: 100%; max-width: 390px; height: 844px; overflow: hidden; background: #f4f5f6; font-family: 'Noto Sans KR', sans-serif; color: #111827; display: flex; flex-direction: column">
<header style="background: #ffffff; padding: 10px 12px; border-bottom: 1px solid #e5e7eb"><p style="margin: 0; font-size: 13px; color: #4b5563">초대 링크로 열림</p><p style="margin: 0; font-size: 18px; font-weight: 700">직원 초대 받기</p></header>
<div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px; display: flex; flex-direction: column; gap: 8px"><section style="background: #ffffff; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0"><p style="margin: 0; font-size: 20px; font-weight: 700">[매장 이름]에서<br>같이 쓰자고 초대했어요</p><p style="margin: 0; font-size: 15px; color: #374151">역할: 직원 · 초대한 사람: [점주 이름]</p></section><section style="background: #ffffff; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0"><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 6px 0; border-bottom: 1px solid #f3f4f6"><span style="min-width: 0">할 수 있는 일</span><span style="white-space: nowrap;">장바구니 담기 · 받기 확인</span></div><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px; padding: 6px 0; border-bottom: 1px solid #f3f4f6"><span style="min-width: 0">링크 유효</span><span style="white-space: nowrap;">11/24까지 · 한 번만</span></div></section><p style="margin: 0; font-size: 14px; color: #4b5563">카카오로 시작하면 바로 이 매장 화면으로 들어가요 · 매장 정보는 다시 입력하지 않아요</p></div>
<div style="background: #ffffff; padding: 10px 12px; border-top: 1px solid #e5e7eb; display: flex; flex-direction: column; gap: 6px"><button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 8px; background: #fee500; color: #111827; font-size: 17px; font-weight: 700; font-family: inherit">카카오로 시작하고 같이 쓰기</button><span style="font-size: 12px; color: #4b5563; text-align: center">시작하면 거래 약관 · 개인정보 처리 동의</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#0f766e"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() { return { accent: this.props.accent ?? '#0f766e' }; }
}
</script>

</html>
