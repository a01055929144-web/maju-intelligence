name: CX128 QR display PG17
on:
  pull_request:
    paths:
      - 'docs/sql-drafts/2026-11-22-CX-128-document-qr-display*'
      - 'tests/sql/document-qr-display.pg17.test.sql'
      - '.github/workflows/cx128-qr-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qr-display-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: document_qr_display_test
      DOCUMENT_VAT_TEST_DATABASE: document_qr_display_test
      DOCUMENT_QR_TEST_DATABASE: document_qr_display_test
    steps:
      - uses: actions/checkout@v4
      - run: createdb document_qr_display_test
      - run: psql -X --set=ON_ERROR_STOP=1 --file=tests/sql/document-qr-display.pg17.test.sql
