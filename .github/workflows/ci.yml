name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lead-customer-continuity-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maju_continuity_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maju_continuity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify lead-customer continuity on PostgreSQL 17
        working-directory: docs/sql-drafts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: maju_continuity_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql --set=ON_ERROR_STOP=1 --file=20261029-lead-customer-continuity.pg16.test.sql

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: API authentication boundaries
        run: npm run check:auth-boundaries

      - name: Dependency security audit
        # Tailwind 3's build-only dependency currently has no non-breaking high-level patch.
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
        env:
          CI_LAYOUT_FIXTURES: enabled

      - name: Install Playwright browser
        # GitHub's Ubuntu image already contains Chromium's system libraries.
        # Avoid apt in PR jobs: an apt mirror stall otherwise blocks every check.
        run: npx playwright install chromium

      - name: Responsive layout and route smoke checks
        run: npm run test:e2e:layout
        env:
          CI_LAYOUT_FIXTURES: enabled

      - name: Upload responsive layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-report
          path: |
            playwright-report
            test-results/layout
          if-no-files-found: ignore
          retention-days: 14
