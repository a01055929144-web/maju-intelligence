name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: API authentication boundaries
        run: npm run check:auth-boundaries

      - name: Dependency security audit
        # Tailwind 3's build-only dependency currently has no non-breaking high-level patch.
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        # GitHub's Ubuntu image already contains Chromium's system libraries.
        # Avoid apt in PR jobs: an apt mirror stall otherwise blocks every check.
        run: npx playwright install chromium

      - name: Responsive layout and route smoke checks
        run: npm run test:e2e:layout

      - name: Upload responsive layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-report
          path: |
            playwright-report
            test-results/layout
          if-no-files-found: ignore
          retention-days: 14
