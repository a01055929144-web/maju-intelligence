          PGPASSWORD: postgres
        run: |
          createdb lead_store_area_test
          cd docs/sql-drafts
          psql --dbname=lead_store_area_test --set=ON_ERROR_STOP=1 --file=20261102-L2-store-area.pg17.test.sql

      - name: Verify purchase receipt correction draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
