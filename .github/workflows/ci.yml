          PGPASSWORD: postgres
        run: |
          createdb store_cost_test
          cd docs/sql-drafts
          psql --dbname=store_cost_test --set=ON_ERROR_STOP=1 --file=20261105-store-cost-management.pg17.test.sql

      - name: Verify atomic store cost batch import draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb store_cost_batch_test
          cd docs/sql-drafts
          psql --dbname=store_cost_batch_test --set=ON_ERROR_STOP=1 --file=20261107-store-cost-batch-import.pg17.test.sql

      - name: Verify atomic customer import draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb customer_import_atomicity_test
          cd docs/sql-drafts
          psql --dbname=customer_import_atomicity_test --set=ON_ERROR_STOP=1 --file=20261107-customer-import-atomicity.pg17.test.sql

      - name: Verify store Kakao membership draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb store_kakao_membership_test
          cd docs/sql-drafts
          psql --dbname=store_kakao_membership_test --set=ON_ERROR_STOP=1 --file=20261105-store-kakao-membership.pg17.test.sql

      - name: Verify store member removal draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb store_member_removal_test
          cd docs/sql-drafts
          psql --dbname=store_member_removal_test --set=ON_ERROR_STOP=1 --file=20261108-store-member-removal.pg17.test.sql

      - name: Verify store owner activation draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb store_owner_activation_test
          cd docs/sql-drafts
          psql --dbname=store_owner_activation_test --set=ON_ERROR_STOP=1 --file=20261107-store-owner-activation.pg17.test.sql
          if psql --dbname=store_owner_activation_test --set=ON_ERROR_STOP=1 --file=20261107-store-owner-activation.down.sql; then
            echo "owner activation rollback unexpectedly accepted existing history"
            exit 1
          fi
          psql --dbname=store_owner_activation_test --set=ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if to_regclass('public.store_owner_activation_requests') is null
              or to_regprocedure('public.prepare_store_owner_activation_v1(uuid,uuid,uuid,text)') is null
              or to_regprocedure('public.activate_store_owner_v1(text,uuid,text,timestamptz,text,text,timestamptz,text)') is null
            then raise exception 'rejected_activation_rollback_changed_schema'; end if;
          end $$;
          SQL

      - name: Verify selling price direction opt-in on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb storefront_price_direction_test
          psql --dbname=storefront_price_direction_test --set=ON_ERROR_STOP=1 --file=tests/sql/storefront-price-direction.pg17.test.sql

      - name: Verify document archive without removing links or orders on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb pricing_document_archive_test
          psql --dbname=pricing_document_archive_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-document-archive.pg17.test.sql

      # Read-only dependency on #285's unapproved SQL contract. Never apply to an operating database.
      - name: Checkout pinned lead-share SQL draft for isolated tests
        uses: actions/checkout@v5
        with:
          ref: 0833fe91fa37425e12ba9f217c6ceb4d8f0683b8
          path: .ci-lead-share-schema
          persist-credentials: false

      - name: Verify lead-sharing runtime contracts on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb lead_share_runtime_test
          psql --dbname=lead_share_runtime_test --set=ON_ERROR_STOP=1 --file=.ci-lead-share-schema/tests/sql/pricing-lead-document-share-migrations.pg17.test.sql
          psql --dbname=lead_share_runtime_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-lead-share-runtime.pg17.test.sql
          psql --dbname=lead_share_runtime_test --set=ON_ERROR_STOP=1 --file=.ci-lead-share-schema/tests/sql/pricing-lead-share-atomic.pg17.test.sql
          node scripts/test-lead-share-concurrency.mjs
          createdb lead_share_policy_test
          psql --dbname=lead_share_policy_test --set=ON_ERROR_STOP=1 --file=.ci-lead-share-schema/tests/sql/pricing-lead-document-share.pg17.test.sql

      - name: Verify lead document share draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb pricing_lead_document_share_test
          psql --dbname=pricing_lead_document_share_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-lead-document-share.pg17.test.sql
          createdb pricing_lead_document_share_migrations_test
          psql --dbname=pricing_lead_document_share_migrations_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-lead-document-share-migrations.pg17.test.sql
          psql --dbname=pricing_lead_document_share_migrations_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-lead-share-atomic.pg17.test.sql
          createdb pricing_public_document_entry_test
          psql --dbname=pricing_public_document_entry_test --set=ON_ERROR_STOP=1 --file=tests/sql/public-document-entry-09.pg17.test.sql
          createdb pricing_lead_share_company_delete_test
          psql --dbname=pricing_lead_share_company_delete_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-lead-share-company-delete.pg17.test.sql

      - name: Setup Node for member-order concurrency checks
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify compatible member ordering on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: store_member_order_test
        run: |
          createdb store_member_order_test
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-member-order.pg17.test.sql
          npm ci --ignore-scripts
          node scripts/test-store-member-order-concurrency.mjs
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-member-full-journey.pg17.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-preopening.pg17.test.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/pending-delivery-order.pg17.test.sql
          if psql --set=ON_ERROR_STOP=1 --file=docs/sql-drafts/20261110-09-pending-delivery-order.down.sql; then
            echo "pending delivery rollback unexpectedly accepted existing orders"
            exit 1
          fi

      - name: Verify disposable storefront fixture on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb storefront_synthetic_fixture_test
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-p1-fixture.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=supabase/migrations/20261102114600_pricing_p0.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=supabase/migrations/20261102114601_pricing_p1.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-p2-fixture.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=supabase/migrations/20261102114602_pricing_p2_store_ordering.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=tests/sql/storefront-synthetic-fixture.pg17.sql

  build:
    runs-on: ubuntu-latest
    services:
      readonly-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check generated schema document
        run: node scripts/gen-schema-doc.mjs --check

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: API authentication boundaries
        run: npm run check:auth-boundaries

      - name: Dependency security audit
        # Tailwind 3's build-only dependency currently has no non-breaking high-level patch.
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
        env:
          CI_LAYOUT_FIXTURES: enabled
          HOLD_MODULES_ENABLED_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PUBLIC_DOCUMENT_ORDER_ENTRY_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PRICE_SHEETS_ENABLED: "true"
          FEATURE_PRICING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001

      - name: Install Playwright browser
        # GitHub's Ubuntu image already contains Chromium's system libraries.
        # Avoid apt in PR jobs: an apt mirror stall otherwise blocks every check.
        run: npx playwright install chromium

      - name: Verify 09 public document entry and all published order products
        run: npx playwright test tests/e2e/pricing-lead-sharing.spec.ts tests/e2e/storefront-price-direction.spec.ts --workers=2 --retries=0 --timeout=90000
        env:
          CI_LAYOUT_FIXTURES: enabled
          HOLD_MODULES_ENABLED_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PUBLIC_DOCUMENT_ORDER_ENTRY_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PRICE_SHEETS_ENABLED: "true"
          FEATURE_PRICING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001

      - name: Responsive layout and route smoke checks
        run: npm run test:e2e:layout -- tests/e2e/customer-items-import.spec.ts tests/e2e/document-recalculation.spec.ts tests/e2e/pricing-spec-flow.spec.ts tests/e2e/store-member-management-entry.spec.ts tests/e2e/pricing-document-actions.spec.ts tests/e2e/shared-pricing-acceptance.spec.ts tests/e2e/store-member-journey.spec.ts tests/e2e/store-cost-panel.spec.ts tests/e2e/store-cost-upload.spec.ts tests/e2e/store-kakao-entry.spec.ts tests/e2e/supplier-conversion-review.spec.ts tests/e2e/purchase-cost-atomic-batch.spec.ts tests/e2e/pending-delivery-order.spec.ts
        env:
          CI_LAYOUT_FIXTURES: enabled
          HOLD_MODULES_ENABLED_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PUBLIC_DOCUMENT_ORDER_ENTRY_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PRICE_SHEETS_ENABLED: "true"
          FEATURE_PRICING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001

      - name: Readonly 18-product storefront against isolated PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          P2_READONLY_PG17_SMOKE: "true"
          PRICING_P2_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/readonly_storefront_browser_test
        run: |
          createdb readonly_storefront_browser_test
          psql --dbname=readonly_storefront_browser_test --set=ON_ERROR_STOP=1 --file=tests/sql/readonly-storefront-browser.pg17.fixture.sql
          node scripts/test-pricing-p2-browser.mjs

      - name: Upload responsive layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-report
          path: |
            playwright-report
            test-results/layout
            test-results/readonly-pg17
          if-no-files-found: ignore
          retention-days: 14
