name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 같은 브랜치에 다시 푸시하면 이전 PR 실행을 취소한다. main(push)은 취소하지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 문서만 바뀐 PR은 build·PG17을 건너뛴다. 두 job은 필수 체크라서 paths-ignore(체크가 영원히 대기)를 쓰지 않고, job을 건너뛴다(건너뛴 job은 성공으로 본다).
  # 판별이 실패하면 docs_only가 비어 있어 전부 실행한다(안전한 쪽).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scan.outputs.docs_only }}
      sql_drafts: ${{ steps.scan.outputs.sql_drafts }}
    steps:
      - id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 이름이 바뀐 파일은 이전 경로도 본다(코드를 docs로 옮겨 검사를 피하지 못하게).
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')
          # docs/** 와 *.md 만 바뀌면 문서 전용. 파일이 하나도 없으면 문서 전용으로 보지 않는다.
          code=$(printf '%s\n' "$files" | grep -Ev '^(docs/|$)|\.md$' || true)
          if [ -n "$files" ] && [ -z "$code" ]; then docs_only=true; else docs_only=false; fi
          if printf '%s\n' "$files" | grep '^docs/sql-drafts/' > /dev/null; then sql_drafts=true; else sql_drafts=false; fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "sql_drafts=$sql_drafts" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only sql_drafts=$sql_drafts"

  migration-approval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require approval for new migration files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status == "added" and (.filename | startswith("supabase/migrations/"))) | .filename')
          if [ -n "$files" ] && ! printf '%s\n' "$PR_BODY" | grep -Eq '^DB-APPROVED: fcmdvveqmcgtioelzqun [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} (KST|UTC)$'; then
            echo 'New migration requires a project-specific DB-APPROVED line with approval time in the PR body.'
            exit 1
          fi

  lead-customer-continuity-pg17:
    needs: changes
    # 문서만 바뀐 PR은 건너뛴다. 단 docs/sql-drafts/** 가 바뀌면 PG17은 그대로 실행한다. main(push)은 항상 실행.
    if: ${{ always() && (github.event_name == 'push' || needs.changes.outputs.docs_only != 'true' || needs.changes.outputs.sql_drafts == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maju_continuity_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
