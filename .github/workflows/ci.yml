name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  migration-approval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require approval for new migration files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status == "added" and (.filename | startswith("supabase/migrations/"))) | .filename')
          if [ -n "$files" ] && ! printf '%s\n' "$PR_BODY" | grep -Eq '^DB-APPROVED: fcmdvveqmcgtioelzqun [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} (KST|UTC)$'; then
            echo 'New migration requires a project-specific DB-APPROVED line with approval time in the PR body.'
            exit 1
          fi

  lead-customer-continuity-pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maju_continuity_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maju_continuity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify lead-customer continuity on PostgreSQL 17
        working-directory: docs/sql-drafts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: maju_continuity_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql --set=ON_ERROR_STOP=1 --file=20261029-lead-customer-continuity.pg16.test.sql

      - name: Verify WO-03 product catalog schema draft on PostgreSQL 17
