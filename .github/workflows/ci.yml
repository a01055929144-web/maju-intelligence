          PGDATABASE: maju_continuity_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql --set=ON_ERROR_STOP=1 --file=20261101165122_wo21_login_accounts.pg17.test.sql

      - name: Verify WO-21 role settings draft on PostgreSQL 17
        working-directory: docs/sql-drafts
