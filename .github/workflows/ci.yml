          psql --dbname=songpa_delivery_seed_test --set=ON_ERROR_STOP=1 --file=tests/sql/songpa-delivery-seed.pg17.test.sql

      - name: Setup Node for member-order concurrency checks
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify compatible member ordering on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: store_member_order_test
        run: |
          createdb store_member_order_test
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-member-order.pg17.test.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/order-settings-defaults-09.pg17.test.sql
          npm ci --ignore-scripts
          node scripts/test-store-member-order-concurrency.mjs
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-member-full-journey.pg17.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-preopening.pg17.test.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/pending-delivery-order.pg17.test.sql
          if psql --set=ON_ERROR_STOP=1 --file=docs/sql-drafts/20261110-09-pending-delivery-order.down.sql; then
            echo "pending delivery rollback unexpectedly accepted existing orders"
            exit 1
          fi
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-profiles-cx10.pg17.test.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-connect-cx12.pg17.test.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-customer-review-cx13.pg17.test.sql

      - name: Verify CX-08 promotion reservations on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: store_member_order_test_cx08
        run: |
          createdb store_member_order_test_cx08
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/store-member-order.pg17.test.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/promotion-reservation-cx08.pg17.test.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/promotion-audience-orders-cc29b.pg17.test.sql
          psql --set=ON_ERROR_STOP=1 --file=tests/sql/promotion-normal-price-cc29c.pg17.test.sql
          node scripts/test-promotion-reservation-cx08.mjs

      - name: Verify disposable storefront fixture on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb storefront_synthetic_fixture_test
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-p1-fixture.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=supabase/migrations/20261102114600_pricing_p0.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=supabase/migrations/20261102114601_pricing_p1.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-p2-fixture.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=supabase/migrations/20261102114602_pricing_p2_store_ordering.sql
          psql --dbname=storefront_synthetic_fixture_test --set=ON_ERROR_STOP=1 --file=tests/sql/storefront-synthetic-fixture.pg17.sql

  build:
    needs: changes
    # 문서만 바뀐 PR(sql-drafts 포함)은 build·e2e를 건너뛴다. main(push)은 항상 실행.
    if: ${{ always() && (github.event_name == 'push' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    services:
      readonly-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check generated schema document
        run: node scripts/gen-schema-doc.mjs --check

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: API authentication boundaries
        run: npm run check:auth-boundaries

      - name: Dependency security audit
        # Tailwind 3's build-only dependency currently has no non-breaking high-level patch.
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
        env:
          CI_LAYOUT_FIXTURES: enabled
          HOLD_MODULES_ENABLED_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PUBLIC_DOCUMENT_ORDER_ENTRY_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PRICE_SHEETS_ENABLED: "true"
          FEATURE_PRICING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001

      - name: Install Playwright browser
        # GitHub's Ubuntu image already contains Chromium's system libraries.
        # Avoid apt in PR jobs: an apt mirror stall otherwise blocks every check.
        run: npx playwright install chromium

      - name: Verify 09 public document entry and all published order products
        run: npx playwright test tests/e2e/pricing-lead-sharing.spec.ts tests/e2e/storefront-price-direction.spec.ts --workers=2 --retries=0 --timeout=90000
        env:
          CI_LAYOUT_FIXTURES: enabled
          HOLD_MODULES_ENABLED_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PUBLIC_DOCUMENT_ORDER_ENTRY_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PRICE_SHEETS_ENABLED: "true"
          FEATURE_PRICING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001

      - name: Responsive layout and route smoke checks
        run: npm run test:e2e:layout -- tests/e2e/customer-items-import.spec.ts tests/e2e/document-recalculation.spec.ts tests/e2e/pricing-spec-flow.spec.ts tests/e2e/store-member-management-entry.spec.ts tests/e2e/store-shell.spec.ts tests/e2e/store-direct-signup.spec.ts tests/e2e/pricing-document-actions.spec.ts tests/e2e/shared-pricing-acceptance.spec.ts tests/e2e/store-member-journey.spec.ts tests/e2e/store-cost-panel.spec.ts tests/e2e/store-cost-upload.spec.ts tests/e2e/store-kakao-entry.spec.ts tests/e2e/supplier-conversion-review.spec.ts tests/e2e/purchase-cost-atomic-batch.spec.ts tests/e2e/store-delivery-eligibility.spec.ts tests/e2e/pricing-paper-columns.spec.ts tests/e2e/order-inbox.spec.ts
        env:
          CI_LAYOUT_FIXTURES: enabled
          HOLD_MODULES_ENABLED_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PUBLIC_DOCUMENT_ORDER_ENTRY_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_ENABLED: "true"
          LEAD_DOCUMENT_SHARING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001
          PRICE_SHEETS_ENABLED: "true"
          FEATURE_PRICING_COMPANY_IDS: 00000000-0000-4000-8000-000000000001

      - name: Readonly 18-product storefront against isolated PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          P2_READONLY_PG17_SMOKE: "true"
          PRICING_P2_LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/readonly_storefront_browser_test
        run: |
          createdb readonly_storefront_browser_test
          psql --dbname=readonly_storefront_browser_test --set=ON_ERROR_STOP=1 --file=tests/sql/readonly-storefront-browser.pg17.fixture.sql
          node scripts/test-pricing-p2-browser.mjs

      - name: Upload responsive layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-report
          path: |
            playwright-report
            test-results/layout
            test-results/readonly-pg17
          if-no-files-found: ignore
          retention-days: 14
