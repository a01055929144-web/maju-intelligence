          PGPASSWORD: postgres
        run: |
          createdb store_cost_test
          cd docs/sql-drafts
          psql --dbname=store_cost_test --set=ON_ERROR_STOP=1 --file=20261105-store-cost-management.pg17.test.sql

      - name: Verify store Kakao membership draft on PostgreSQL 17
