      - name: Verify WO-25 customer item file audit on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb customer_items_test_ui
          psql --dbname=customer_items_test_ui --set=ON_ERROR_STOP=1 --file=docs/sql-drafts/20261102-WO-25-customer-items-audit.pg17.test.sql

      - name: Verify first supplier import to P0 recalculation on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb usable_now_first_import_test
          psql --dbname=usable_now_first_import_test --set=ON_ERROR_STOP=1 --file=tests/sql/pricing-p0-fixture.sql
          psql --dbname=usable_now_first_import_test --set=ON_ERROR_STOP=1 --file=docs/sql-drafts/20261030-pricing-p0.sql
          psql --dbname=usable_now_first_import_test --set=ON_ERROR_STOP=1 --file=tests/sql/usable-now-first-import.pg17.sql

      - name: Verify purchase-cost batch save and restore draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb purchase_cost_batch_test
          psql --dbname=purchase_cost_batch_test --set=ON_ERROR_STOP=1 --file=docs/sql-drafts/20261107-purchase-cost-batch.pg17.test.sql

      - name: Verify purchase-date v2 draft on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb purchase_cost_date_v2_test
          psql --dbname=purchase_cost_date_v2_test --set=ON_ERROR_STOP=1 --file=docs/sql-drafts/20261107-purchase-cost-date-v2.pg17.test.sql

      - name: Verify L-2 store area approval on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
