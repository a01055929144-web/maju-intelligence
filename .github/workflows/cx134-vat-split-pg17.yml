name: CX-134 VAT split PG17
on:
  pull_request:
    paths:
      - '.github/workflows/cx134-vat-split-pg17.yml'
      - 'docs/sql-drafts/2026-11-24-CX-134-*.sql'
permissions:
  contents: read
jobs:
  pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cx134_test
    steps:
      - uses: actions/checkout@v5
      - run: createdb cx134_test
      - run: psql -X --set=ON_ERROR_STOP=1 --file=docs/sql-drafts/2026-11-24-CX-134-vat-split.pg17.test.sql
