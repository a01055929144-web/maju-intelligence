name: 08 Stage F PostgREST PG17
on:
  pull_request:
    paths:
      - app/admin/operations/**
      - scripts/setup-admin-stage-f-postgrest.mjs
      - tests/admin-stage-f-postgrest.integration.test.ts
      - .github/workflows/08-stage-f-postgrest.yml
permissions:
  contents: read
jobs:
  stage-f-postgrest-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maju_stage_a_integration
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd "pg_isready -U postgres -d maju_stage_a_integration" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STAGE_A_INTEGRATION: isolated
      ADMIN_STAGE_F_POSTGREST: isolated
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: maju_stage_a_integration
      PGUSER: postgres
      SUPABASE_URL: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Load disposable PG17 schema
        run: node scripts/setup-stage-a-integration.mjs
      - name: Add Stage F schema and synthetic companies
        run: node scripts/setup-admin-stage-f-postgrest.mjs
      - name: Start isolated PostgREST
        run: >-
          docker run --detach --network host
          --env PGRST_DB_URI=postgres://postgres@127.0.0.1:5432/maju_stage_a_integration
          --env PGRST_DB_SCHEMAS=public --env PGRST_DB_ANON_ROLE=anon
          --env PGRST_JWT_SECRET --env PGRST_DB_MAX_ROWS=1000 --env PGRST_SERVER_PORT=3002
          postgrest/postgrest:v12.2.8
      - name: Wait for isolated PostgREST
        run: for i in {1..30}; do curl --fail --silent http://127.0.0.1:3002/ >/dev/null && exit 0; sleep 1; done; exit 1
      - name: Verify real Stage F reads
        run: npx vitest run tests/admin-stage-f-postgrest.integration.test.ts
