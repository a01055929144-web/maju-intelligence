name: CX-144 store connection PG17
on:
  pull_request:
    paths:
      - '.github/workflows/cx144-store-connection-pg17.yml'
      - 'docs/sql-drafts/2026-11-25-CX-144-*.sql'
      - 'docs/sql-drafts/20261105-store-kakao-membership.sql'
      - 'docs/sql-drafts/20261107-store-owner-activation.sql'
permissions:
  contents: read
jobs:
  pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cx144_test
    steps:
      - uses: actions/checkout@v5
      - run: createdb cx144_test
      - run: psql -X --set=ON_ERROR_STOP=1 --file=docs/sql-drafts/2026-11-25-CX-144-u0-admin-store-connection.pg17.test.sql
      - run: createdb cx144_u0b_test
      - run: psql -X --set=ON_ERROR_STOP=1 --dbname=cx144_u0b_test --file=docs/sql-drafts/2026-11-25-CX-144-u0b-force-link.pg17.test.sql
